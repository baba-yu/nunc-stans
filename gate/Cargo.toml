[package]
name = "nunc-stans-gate"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Single-origin front door: static UI serving plus loopback reverse proxies to the ledger engine and the fourfive server."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
# Loopback-only plain-http client for the reverse proxy: no TLS stack on
# purpose (the gate never talks to anything but 127.0.0.1).
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
