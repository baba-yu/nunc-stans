<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    max-width: 44rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  #provenance { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1.6rem; }
  h2 { font-size: 1.05rem; margin: 1.6rem 0 0.6rem; border-bottom: 1px solid rgba(128,128,128,.35); padding-bottom: 0.25rem; }
  .card { border: 1px solid rgba(128,128,128,.35); border-radius: 8px; padding: 0.7rem 0.9rem; margin: 0.5rem 0; }
  .card .title { font-weight: 600; }
  .meta { font-size: 0.82rem; opacity: 0.75; }
  .note { font-size: 0.85rem; margin-top: 0.3rem; }
  ul.edges { list-style: none; padding: 0; }
  ul.edges li { padding: 0.35rem 0; border-bottom: 1px dashed rgba(128,128,128,.25); font-size: 0.9rem; }
  .etype { font-variant: small-caps; opacity: 0.75; padding: 0 0.35rem; }
  .toid { font-size: 0.75rem; opacity: 0.55; display: block; }
  .warn { color: #b00; font-size: 0.85rem; }
  form { border: 1px dashed rgba(128,128,128,.4); border-radius: 8px; padding: 0.8rem; margin-top: 0.8rem; display: grid; gap: 0.45rem; }
  form input, form textarea { font: inherit; padding: 0.3rem 0.45rem; }
  form button { font: inherit; padding: 0.35rem 0.8rem; width: fit-content; }
  #msg { font-size: 0.85rem; min-height: 1.2rem; }
</style>
</head>
<body>
<h1>ME</h1>
<div id="provenance">loading…</div>

<h2>Commitments</h2>
<div id="commitments"></div>

<form id="commitForm">
  <strong>Author a commitment</strong>
  <input name="slug" placeholder="slug (a-z, 0-9, -)" required pattern="[a-z0-9-]+">
  <input name="title" placeholder="title" required>
  <input name="started_at" placeholder="started_at (YYYY-MM-DD)" required>
  <input name="money_jpy" placeholder="money_jpy (optional)" inputmode="numeric">
  <input name="hours" placeholder="hours (optional)" inputmode="decimal">
  <textarea name="note" placeholder="note (optional)" rows="2"></textarea>
  <button type="submit">Author (user peer)</button>
  <div id="msg"></div>
</form>

<h2>Edges</h2>
<ul class="edges" id="edges"></ul>

<script>
// The ME view talks to nuncstans-engine over HTTP only — it never reads
// engine internals or the vault directly (constitution §11).
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function yen(n) {
  return n == null ? null : "¥" + Number(n).toLocaleString("en-US");
}

async function load() {
  let commitments = [], edges = [], cm = 0, em = 0;
  try {
    const [cr, er] = await Promise.all([
      fetch("/self/commitments").then(r => r.json()),
      fetch("/self/edges").then(r => r.json()),
    ]);
    commitments = cr.commitments || []; cm = cr.malformed_skipped || 0;
    edges = er.edges || []; em = er.malformed_skipped || 0;
  } catch (e) {
    $("provenance").textContent = "engine unreachable — is `just up` running?";
    return;
  }

  // F9: the one-line provenance mix — of my own bets, the proportion
  // prompted by AI-routed information. Computed from edges: a commitment is
  // AI-prompted if it is the source of an informed_by edge whose author is
  // ai or sensor. Recomputed here, not asserted (journey check 6).
  const commitmentIds = new Set(commitments.map(c => c.id));
  const aiPrompted = new Set();
  for (const e of edges) {
    if (e.type === "informed_by" && (e.author === "ai" || e.author === "sensor")
        && commitmentIds.has(e.from)) {
      aiPrompted.add(e.from);
    }
  }
  const n = commitments.length;
  const k = aiPrompted.size;
  const pct = n ? Math.round((k / n) * 100) : 0;
  $("provenance").textContent =
    `provenance: ${k}/${n} of my bets were AI-prompted (${pct}%) · ${edges.length} edges` +
    (cm + em ? ` · ${cm + em} malformed record(s) skipped` : "");

  const cbox = $("commitments");
  cbox.replaceChildren();
  for (const c of commitments) {
    const card = el("div", "card");
    card.append(el("div", "title", c.title || c.id));
    const res = c.resources || {};
    const bits = [c.id, c.started_at, yen(res.money_jpy), res.hours != null ? res.hours + "h" : null]
      .filter(Boolean).join(" · ");
    card.append(el("div", "meta", bits));
    if (c.note) card.append(el("div", "note", c.note));
    cbox.append(card);
  }
  if (!commitments.length) cbox.append(el("p", "meta", "no commitments yet"));

  const ebox = $("edges");
  ebox.replaceChildren();
  for (const e of edges) {
    const li = el("li");
    // Fallback display by to_label: the target store may not be reachable,
    // the label always is (constitution Phase 1).
    li.append(el("span", null, e.from_label || e.from));
    li.append(el("span", "etype", e.type + " →"));
    li.append(el("span", null, e.to_label));
    li.append(el("span", "toid", e.to + (e.author ? ` · by ${e.author}` : "")));
    ebox.append(li);
  }
  if (!edges.length) ebox.append(el("li", "meta", "no edges yet"));
}

// Read a response whether the engine answered with its JSON error contract
// or axum answered with a plain-text extractor rejection (4xx/415). Never
// let `r.json()` throw and kill the handler silently.
async function readResult(r) {
  const text = await r.text();
  try { return JSON.parse(text); }
  catch { return { error: text || `HTTP ${r.status}` }; }
}

$("commitForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  // money_jpy is an integer count of yen on the server (Option<i64>); parse it
  // as one here so a stray decimal becomes a clean client-side error, not a
  // server rejection.
  const rawMoney = (f.get("money_jpy") || "").trim();
  let money = null;
  if (rawMoney) {
    if (!/^\d+$/.test(rawMoney)) {
      $("msg").textContent = "money_jpy must be a whole number of yen";
      $("msg").className = "warn";
      return;
    }
    money = Number(rawMoney);
  }
  const rawHours = (f.get("hours") || "").trim();
  const body = {
    slug: f.get("slug"), title: f.get("title"), started_at: f.get("started_at"),
    resources: { money_jpy: money, hours: rawHours ? Number(rawHours) : null },
    note: f.get("note") || null,
  };
  let r, out;
  try {
    r = await fetch("/self/commitments", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    out = await readResult(r);
  } catch (e) {
    $("msg").textContent = "engine unreachable";
    $("msg").className = "warn";
    return;
  }
  $("msg").textContent = r.ok
    ? `authored ${out.id}` + (out.vault_committed ? " (vault committed)" : " (vault commit FAILED)")
    : `refused: ${out.error}`;
  $("msg").className = r.ok ? "" : "warn";
  if (r.ok) { ev.target.reset(); load(); }
});

load();
</script>
</body>
</html>
