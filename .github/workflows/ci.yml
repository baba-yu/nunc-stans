name: ci
on:
  push:
    branches: [main, dev, newstack, 'phase/**']
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the actual version
      - run: cargo test --manifest-path engines/nunc-stans/Cargo.toml
      - run: cargo test --manifest-path gate/Cargo.toml

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C frontend/nunc-stans-formans test
      - run: corepack pnpm -C frontend/nunc-stans-formans build
      - run: corepack pnpm -C engines/fourfive typecheck
      - run: corepack pnpm -C engines/fourfive test

  # Data-independent subset only until Phase C brings golden masters; the
  # excluded tests need the live report/prediction data that stays in ~/news
  # (see engines/nunc-fluens/INTEGRATION.md and design/verification/phase-a.md).
  nunc-fluens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest jinja2 pyyaml
      - run: >-
          python -m pytest tests -q
          --ignore=tests/test_rename_future_titles.py
          --deselect tests/test_export.py::test_prediction_nodes_include_evidence
          --deselect tests/test_plain_language_quick_def_rename.py::test_news_markdown_renders_plain_language_prose
        working-directory: engines/nunc-fluens/app

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check.ts
      - run: sh tools/bootstrap.sh || true # doctor report (informational on runners)
