name: ci
on:
  push:
    branches: [main, dev, newstack, 'phase/**']
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the actual version
      - run: cargo test --manifest-path engines/nunc-stans/Cargo.toml
      - run: cargo test --manifest-path gate/Cargo.toml

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C frontend/nunc-stans-formans test
      - run: corepack pnpm -C frontend/nunc-stans-formans build
      - run: corepack pnpm -C engines/fourfive typecheck
      - run: corepack pnpm -C engines/fourfive test

  # The TS pipeline suite (Phase C T12: Python retired). Self-regression
  # against the synthetic fixture corpus committed under
  # engines/nunc-fluens/pipeline/goldens/ — no external data, 3-OS.
  nunc-fluens:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C engines/nunc-fluens/pipeline typecheck
      - run: corepack pnpm -C engines/nunc-fluens/pipeline test
      - run: corepack pnpm -C frontend/packages/ai test

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check.ts
      - run: sh tools/bootstrap.sh || true # doctor report (informational on runners)
