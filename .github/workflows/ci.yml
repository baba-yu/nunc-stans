name: ci
on:
  push:
    branches: [main, dev, newstack, 'phase/**']
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins the actual version
      - run: cargo test --manifest-path engines/nunc-stans/Cargo.toml
      - run: cargo test --manifest-path gate/Cargo.toml

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C frontend/nunc-stans-formans test
      - run: corepack pnpm -C frontend/nunc-stans-formans build
      - run: corepack pnpm -C engines/fourfive typecheck
      - run: corepack pnpm -C engines/fourfive test

  # Full suite: the golden fixture corpus supplies the live-data days the
  # previously excluded tests need (Phase C T1 — see
  # engines/nunc-fluens/pipeline/goldens/fixture-manifest.json).
  nunc-fluens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest jinja2 pyyaml
      - run: node engines/nunc-fluens/pipeline/goldens/capture.ts stage-ci
      - run: python -m pytest tests -q
        working-directory: engines/nunc-fluens/app

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check.ts
      - run: sh tools/bootstrap.sh || true # doctor report (informational on runners)
